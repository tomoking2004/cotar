[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cotar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub",
    # Reached only on the SmolVLM2-2.2B path (`Size` in cotar/models/smolvlm.py), which
    # errors without it. Nothing here imports it, and the 500M this study runs never
    # does — so grep says unused and it is not.
    "num2words",
    "pillow",
    "schedulefree",
    "torch",
    # Imported unconditionally by transformers' Idefics3 image processor, which is the
    # one SmolVLM loads. Nothing here imports it either — same story as num2words, and
    # the reason the README installs it from torch's own wheel index alongside torch.
    "torchvision",
    "tqdm",
    "transformers>=4.46",
    "train4all @ git+https://github.com/tomoking2004/train4all.git@v0.11.0",
    "ujson",
]

[tool.setuptools.packages.find]
include = ["cotar*"]

[tool.ruff]
extend-exclude = ["cotar/data/_gqa_eval.py"]
line-length = 100

[tool.ruff.lint]
# Conventions this code already keeps, selected explicitly because ruff's default rule
# set leaves each of them out — which left every one of them with nothing enforcing it.
#
#   E501    the line width the code is written to
#   I       the order its imports are written in
#   RUF022  the order `__all__` is written in: constants, then classes, then functions
#   DTZ     timezone-naive datetime, which `utils.runtime` uses deliberately and says so
#           with a `noqa` — a directive that names a rule nobody runs suppresses nothing
extend-select = ["DTZ", "E501", "I", "RUF022"]
